[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careervector"
version = "0.2.0"
description = "A local career recommendation engine with TF-IDF and sentence-embedding ranking over O*NET and BLS data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CareerVector Contributors"}]
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5,<6"]
ui = [
  "sentence-transformers>=5,<6",
  "streamlit>=1.35,<2",
]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
careervector = "careervector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
